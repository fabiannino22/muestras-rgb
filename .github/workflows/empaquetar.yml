# Empaqueta la interfaz grafica para Windows y macOS con PyInstaller.
#
# - En cada push que toque el codigo: pruebas + ejecutables como artefactos del run.
# - Al subir una etiqueta vX.Y.Z (igual a muestras_core.VERSION): ademas crea un
#   release en BORRADOR con los .zip, para revisarlo y publicarlo a mano.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Empaquetar

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "*.py"
      - "requirements.txt"
      - "tests/**"
      - "fixtures/tiff/**"
      - ".github/workflows/empaquetar.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empaquetar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest        # Apple Silicon
          - os: macos-15-intel      # Mac con Intel
    runs-on: ${{ matrix.os }}
    env:
      # Sin ventana visible en el runner; el plugin offscreen viene en el paquete.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Version
        shell: bash
        run: |
          VERSION=$(python -c "import muestras_core; print(muestras_core.VERSION)")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con muestras_core.VERSION ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pruebas con las fixtures TIFF
        run: python -m unittest discover tests -v

      - name: Empaquetar
        run: python empaquetar.py --version ${{ env.VERSION }}

      # Corre el ejecutable YA empaquetado: si PyInstaller dejo fuera Qt, littlecms o
      # rompio el multiproceso, aqui truena y no se publica.
      - name: Autoprueba del ejecutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MuestrasRGB\MuestrasRGB.exe" `
               -ArgumentList "--autoprueba", "fixtures\tiff", "autoprueba" -Wait -PassThru
          Get-Content autoprueba\autoprueba.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Autoprueba del ejecutable (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "dist/Muestras RGB.app"
          "dist/Muestras RGB.app/Contents/MacOS/Muestras RGB" --autoprueba fixtures/tiff autoprueba
          cat autoprueba/autoprueba.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MuestrasRGB-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: empaquetar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Muestras RGB $GITHUB_REF_NAME"
